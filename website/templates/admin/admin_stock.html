{% extends 'admin_base.html' %}

{% block title %} Stock Setting {% endblock %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='admin/stock1.css') }}">
{%endblock%}
{% block body %}
<div class="container">
    <button type="button" class="btn btn-secondary" id="expiry" onclick="hideOrShowDiv('expiryDate')">Option
        Expiry</button>
    <button type="button" class="btn btn-secondary" id="stockentry" onclick="hideOrShowDiv('stockEntry')">STOCK
        ENTRY</button>
    </button>
    <br>
    <!-- expiry table -->
    <div id="expiryDate" class="display-none">
        <table id="stockrole">
            <thead>
                <tr>
                    <th>Expiry Section</th>
                </tr>
                <tr>
                    <th> Strike Price </th>
                    <th>Indices</th>
                    <th>Action</th>
                    <!-- <th>Role</th> -->
                </tr>
            </thead>
            <tbody>
                <tr>
                    <form class="container text-center" action="/sudiip/stock" method="post">
                        <td><input type="number" class="form-control" name="strike"></td>
                        <td><select class="form-select" aria-label="Stock Name" name="option_check">
                                <option selected>NIFTY</option>
                                <option>CNXBAN</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select></td>
                        <td><button type="submit" class="btn btn-outline-success" name="expiry">Set</button></td>
                        <!-- <td><button type="submit" class="btn btn-outline-danger" name="roleDel">Delete</button></td> -->
                    </form>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Stock Entry form -->
    <div id="stockEntry" class="display-none">
        <form action="/sudiip/stock" method="post" enctype="multipart/form-data">
            <input type="file" name="file1" class="form-control">
    
    <button type="submit" class="btn btn-primary" name="icici_stock_zip">Upload</button>
    </form>
    </div>
    {%endblock%}
    {% block js %}
    <script src="{{url_for('static', filename = 'admin/stock.js')}}" type="text/javascript"></script>
    {%endblock%}

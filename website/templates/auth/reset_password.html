{% extends "base.html" %} {% block title %}Reset Password{% endblock %}
{% block body %}

<div>
  <div class="container">
    <form method="POST" action="/reset_password">
      <h3 align="center">Forget Password</h3>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" />
        <!-- Add a hidden input field to store the email value -->
        <input type="hidden" id="hiddenEmail" name="hiddenEmail">
      </div>
      <div id="sendMailbt">
        <button type="button" class="btn btn-primary btn-sm" onclick="sendEmail()">Send mail</button>
      </div>
      <div id="checkCaptcha" style="display: none;">
        <input type="text" name="" id="capSec">
        <span hidden="hidden" id="recapcha">Hellp</span>
        <!-- style="display: none;" -->
      <input type="button" value="Submit Code" onclick="activateSection()">
    </div>
    <!-- Hide the section -->
    <div id="myDiv" style="display: none;">
      <div class="form-group">
        <label for="pwd">New Password</label>
        <input type="text" class="form-control" id="pwd" name="pwd" placeholder="Enter New Password" />
      </div>
      
      <button type="submit" class="btn btn-primary" >Submit</button>
  </form>
</div>
{% endblock %}
{% block js %}
<script src="{{url_for('static', filename = 'auth/resetpwd.js')}}" type="text/javascript"></script>
{% endblock%}

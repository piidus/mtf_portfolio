{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
body %}
<div class="container">
  <form method="POST">
    <h3 align="center">Sign Up</h3>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" />
    </div>
    <div id="sendMailbt">
    <input type="button" value="Send Mail" id="activateButton" onclick="sendEmail()"></div>
    <div id="checkCaptcha" style="display: none;">
      <input type="text" name="" id="capSec">
      <span  id="recapcha">Hellp</span>
      <!-- style="display: none;" -->
      <input type="button" value="Submit Code" onclick="activateSection()">
    </div>
    <!-- Hide the section -->
    <div id="myDiv" style="display: none;">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name" />
      </div>
      <div class="form-group">
        <label for="password1">Password</label>
        <input type="password" class="form-control" id="password1" name="password1" placeholder="Enter password" />
      </div>
      <div class="form-group">
        <label for="password2">Password (Confirm)</label>
        <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm password" />
      </div>
      <div class="form-group">
        <label for="phone">Contact No</label>
        <input type="number" class="form-control" id="phone" name="phone" placeholder="Only 10 numeric Digit" />
      </div>
      <br />
      <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
</div>
{% endblock %}
{% block js %}
<script src="{{url_for('static', filename = 'auth/signup.js')}}" type="text/javascript"></script>
{% endblock%}

{% extends 'user_base.html'%}
<!-- Link to your CSS file using url_for -->
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='all_user/mtf.css') }}">
{%endblock%}
{% block title %} Strategy Page {%endblock%}
{% block body%}
<form action="/mtf" method="post">
    <select name="tags" id="">
        {% for tag in data.tags %}
        <option value="{{tag}}">{{tag}}</option>
        {% endfor %}
    </select>
    <input type="number" name="" id="">
        <button type="submit" name="tagSearch">Search</button>
    
</form>
<table>
    <thead>
        <th> stock name</th>
        <th> ltp</th>
    </thead>
    <tbody id="stockTableBody">
        {% for equity in data.equities %}
        <tr class="equtyToken" data-equity-shortname="{{equity.shortname}}">
            <input type="hidden" name="equityToken" value="{{equity.token}}">
            <!-- <input type="hidden" name="equityShortName" value="{{equity.shortname}}"> -->
            <td>{{equity.company_name}}</td>
            <td><span>value</span></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

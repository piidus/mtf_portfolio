{% extends 'user_base.html'%}
<!-- Link to your CSS file using url_for -->
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='all_user/login.css') }}">
{%endblock%}
{% block body%}

<div class="cointainer-fluid">
    <p>Login Date & Time :: <span style="background-color:grey; color:azure"> {{data['algo_time']}}</span></p>
    <form  method="post" id="api_login">
        <input type="hidden" id="user_id" name="user_id" value="{{user.id}}">
        <button class="btn btn-secondary" type="submit" name="api_login">API LOGIN</button>
    </form>
    <!-- <a href="https://api.icicidirect.com/apiuser/login?api_key=i8582*146#NX60853w32X3*56nd8x8l0" target="_blank">This link will open in a new tab.</a> -->

    <form action="/icici_login" method="post">
        <label for="session_key">API KEY</label>
            <input class="form-control" type="number" name="session_key" id="" placeholder="session key">
        <button class="btn btn-secondary" type="submit" >SET SESSION KEY</button>
    </form>
</div>
<hr>
<br>
<div class="container">
    <!-- <button type="button" class="btn btn-secondary" data-toggle="collapse" data-target="#myForm"  href="#collapseExample">API Entry Form</button> -->
    
    <button class="btn btn-primary" type="button" id="toggleButton">
        API Details
      </button>
      <!-- <div class="collapse" id="collapseExample"> -->
        <form class="hidden-form" action="/icici_login" method="post" id="myForm">
            
            <label for="api_id">API KEY</label>
            <input class="form-control" type="text" name="api_id" id="" placeholder="api key">
            <label for="api_sec">API SECRECT</label>
            <input class="form-control" type="text" name="api_sec" id="" placeholder="api secrect">
            <button class="btn btn-secondary" type="submit" name="cred_delete"> CRED DELETE </button>
            <button class="btn btn-primary" type="submit" name="cred_input"> CRED INPUT </button>
        
        </form>

        
      </div>
</div>

{%endblock%}
{% block js %}
<script src="{{url_for('static', filename = 'all_user/login.js')}}" type="text/javascript"></script>
{%endblock%}

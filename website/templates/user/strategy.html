{% extends 'user_base.html'%}
<!-- Link to your CSS file using url_for -->
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='all_user/strategy.css') }}">
{%endblock%}
{% block title %} Strategy Page {%endblock%}
{% block body%}
<div class="container">
    <button onclick="hideOrShowDiv('sherStrangleForm')">Share Geniuous Strangle</button>
    <button id="sanuMagic" title="In Demo Purpose" disabled>Sanu Magic</button>
</div>
<hr>
<div class="container">
    <table class="display-none" id="sherStrangleForm">
        <thead>
            <tr>
                <td>Index</td>
                <td>Expiry Date</td>
                <td>Lot Size</td>
                <td>Action</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <form action="/dashboard/strategy" method="post">
                <td><input value="NIFTY" name="stock_name" ></td>
                <td>
                    <select class="form-select" size="1" name="expiry">
                        <option selected>Expiry Date</option>
                        {% for date in data.nifty[:5] %}
                        <option>{{date}}</option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <select name="lot" id="">                        
                        <option selected value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </td>
                <td>
                    <button type="submit" name="trade">Trade</button>
                    
                </td>
            </tr>
        </form>
        </tbody>
    </table>
</div>
{%endblock%}
{% block js %}
<script src="{{url_for('static', filename = 'all_user/strategy.js')}}" type="text/javascript"></script>
{%endblock%}
